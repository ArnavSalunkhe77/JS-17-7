<script>
    // type, timestamp, defaultPrevented
    // target, toElement, srcElement, currentTarget,
    // clientX, clientY, screenX, screenY
    // altkey, ctrlkey, shiftkey, keyCode
    document.getElementById('owl').addEventListener('click', (e)=>{
        // console.log(e);
    },false);
    //what does false and true indicate
    // event bubbling - false 
    document.getElementById('images').addEventListener('click', (e)=>{
        // console.log('clicked inside ul');
    },false);
    document.getElementById('owl').addEventListener('click', (e)=>{
        // console.log('owl clicked');
        // e.stopPropagation();
    },false); 
    // when we click on owl as it is inside the ul , both statements will trigger
    // we notice that order is 1) owl clicked followed by 2) clicked inside ul
    // this happens due to event propogation / bubbling in which control goes from bottom to top
    // or inside element to outside element
    // IF - true then it is called as capturing mode which is opp to bubbling 
    // control goes from top to bottom / outside element --> inside element which is just opp to bubbling asw we saw
    // to stop bubbling we use e.stopPropogation()


    // real world scenarios
    const image = document.getElementById('images');
    image.addEventListener('click', (e)=>{
        if(e.target.tagName === 'IMG'){
            let removeNode = e.target.parentNode;
            removeNode.remove();
        }
    },false)
    // console.log(image);
